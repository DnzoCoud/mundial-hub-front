run-name: App CI
on:
    push:
        branches:
            - main
            - development
    pull_request:
        branches:
            - main
            - development
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm
                cache-dependency-path: ./package-lock.json
            - name: Install dependencies
              run: npm ci

            - name: Run lint
              run: npm run lint

            - name: Run tests
              run: npm test -- --run

            - name: Build project
              run: npm run build
            
